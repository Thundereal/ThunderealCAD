<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's jog: a plate stepped up along a sketched line, the line marked -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the plate, the side that stays -->
  <path
     d="M 14,46 42,32 52,37 24,51 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 24,51 52,37 V 41 L 24,55 Z"
     style="fill:#7f8b97;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the run standing up, and the side stepped up behind it -->
  <path
     d="M 14,46 42,32 V 16 L 14,30 Z"
     style="fill:#c98420;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 14,30 42,16 32,11 4,25 Z"
     style="fill:#e9a23b;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the sketched line it steps along -->
  <path
     d="M 10,50 48,31"
     style="fill:none;stroke:#c0392b;stroke-width:3;stroke-linecap:round;stroke-dasharray:5,3;" />
  <!-- the offset -->
  <path
     d="M 57,36 V 17"
     style="fill:none;stroke:#1c2128;stroke-width:2;" />
  <path
     d="M 54,20 57,16 60,20 M 54,33 57,37 60,33"
     style="fill:none;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
</svg>
