<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's flat markings: a flat blank, its bend line, and marks
     etched on it -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the blank, seen from above at a slant -->
  <path
     d="M 4,40 22,12 60,22 42,52 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- its bend line -->
  <path
     d="M 13,26 51,37"
     style="fill:none;stroke:#0050d0;stroke-width:2;stroke-dasharray:4,2;" />
  <!-- the marks: a circle and a cross etched on it -->
  <circle
     cx="34"
     cy="22"
     r="5"
     style="fill:none;stroke:#a020a0;stroke-width:3;" />
  <path
     d="M 22,38 30,44 M 30,38 22,44"
     style="fill:none;stroke:#a020a0;stroke-width:3;stroke-linecap:round;" />
</svg>
