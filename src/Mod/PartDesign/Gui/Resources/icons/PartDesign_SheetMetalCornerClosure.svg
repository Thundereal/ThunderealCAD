<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's corner closure: two flanges standing at a plate's back corner, closed -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the plate -->
  <path
     d="M 32,30 60,44 32,58 4,44 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 4,44 32,58 V 62 L 4,48 Z"
     style="fill:#7f8b97;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the left flange, on the plate's back left edge -->
  <path
     d="M 4,44 32,30 V 4 L 4,18 Z"
     style="fill:#e9a23b;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the right flange, on the back right edge, meeting it at the corner -->
  <path
     d="M 32,30 60,44 V 18 L 32,4 Z"
     style="fill:#b97d22;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the closed seam -->
  <path
     d="M 32,4 V 30"
     style="fill:none;stroke:#1c2128;stroke-width:3;stroke-linecap:round;" />
</svg>
