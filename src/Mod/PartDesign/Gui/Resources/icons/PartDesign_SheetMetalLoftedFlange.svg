<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's lofted flange: a cone frustum of sheet between a wide
     circle below and a narrow one above, its seam a gap at the front -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the sheet's outside, the seam left open at the front -->
  <path
     d="M 30,59 C 15,58 4,54 4,49 L 20,13 C 20,10 25,8 31,8 L 31,15 C 28,15 26,16 26,17 L 13,48 C 13,50 20,52 30,52 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 34,59 C 49,58 60,54 60,49 L 44,13 C 44,10 39,8 33,8 L 33,15 C 36,15 38,16 38,17 L 51,48 C 51,50 44,52 34,52 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the inside seen through the top -->
  <path
     d="M 26,17 C 26,18 28,19 32,19 C 36,19 38,18 38,17"
     style="fill:none;stroke:#1c2128;stroke-width:1.5;" />
</svg>
