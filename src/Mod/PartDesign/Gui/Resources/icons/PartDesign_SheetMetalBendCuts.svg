<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's bend cuts: a plate bent up, slots cut along the bend -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the plate's top -->
  <path
     d="M 33,50 48,50 60,41 45,41 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the wall's inner face -->
  <path
     d="M 19,36 19,14 31,5 31,27 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the bend's inner skin -->
  <path
     d="M 33,50 A 14,14 0 0 1 19,36 L 31,27 A 14,14 0 0 0 45,41 Z"
     style="fill:#f3c27a;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the slots along it, cut through -->
  <path
     d="M 28,48 30.7,46 23.9,39.2 21.3,41.2 Z M 31.9,45.1 34.5,43.1 27.8,36.3 25.1,38.3 Z M 35.7,42.2 38.4,40.2 31.6,33.5 29,35.4 Z"
     style="fill:#1c2128;stroke:#1c2128;stroke-width:1;stroke-linejoin:round;" />
  <!-- the front: plate, bend, wall -->
  <path
     d="M 33,50 48,50 V 55 H 33 Z"
     style="fill:#7f8b97;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 33,50 A 14,14 0 0 1 19,36 H 14 A 19,19 0 0 0 33,55 Z"
     style="fill:#e9a23b;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 14,14 19,14 V 36 H 14 Z"
     style="fill:#7f8b97;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
</svg>
