<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's slots: a plate seen from above at a slant, two slots cut
     through it for another part's tabs -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the plate -->
  <path
     d="M 4,40 22,14 60,24 42,52 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the slots, in a row along the plate -->
  <path
     d="M 20,32 28,23 31,24 23,33 Z M 34,36 42,27 45,28 37,37 Z"
     style="fill:#1c2128;stroke:#1c2128;stroke-width:1.5;stroke-linejoin:round;" />
</svg>
