<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Sheet metal's contour flange: a plate's back edge bent up, then back over it -->
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="64"
   height="64"
   viewBox="0 0 64 64"
   version="1.1">
  <!-- the plate -->
  <path
     d="M 32,30 60,44 32,58 4,44 Z"
     style="fill:#c4cdd6;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 4,44 32,58 V 62 L 4,48 Z"
     style="fill:#7f8b97;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the wall standing on the plate's back edge -->
  <path
     d="M 32,30 60,44 V 26 L 32,12 Z"
     style="fill:#e9a23b;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the lip turned back from its top, and its edge -->
  <path
     d="M 32,12 60,26 48,32 20,18 Z"
     style="fill:#f3c27a;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <path
     d="M 20,18 48,32 V 36 L 20,22 Z"
     style="fill:#b87a22;stroke:#1c2128;stroke-width:2;stroke-linejoin:round;" />
  <!-- the bends -->
  <path
     d="M 32,30 Q 30,25 33,22"
     style="fill:none;stroke:#1c2128;stroke-width:2;stroke-linecap:round;" />
  <path
     d="M 26,15 Q 28,11 33,13"
     style="fill:none;stroke:#1c2128;stroke-width:2;stroke-linecap:round;" />
</svg>
