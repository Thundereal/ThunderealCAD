  <path
     d="M 30,26 L 42,26 L 42,38 L 30,38 Z"
     style="fill:#ef2929;stroke:#a40000;stroke-width:2;stroke-linejoin:round" />
  <path
     d="M 12,12 L 12,31 L 16.5,26.5 L 20,34 L 23.5,32.5 L 20,25 L 26,25 Z"
